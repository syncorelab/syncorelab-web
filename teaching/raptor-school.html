<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Raptor School – Paper Writing Exercises</title>
<style>
  :root {
    --cyan: #00BFF3;
    --cyan-dark: #0089b3;
    --yellow: #FFD23F;
    --ink: #2b2f36;
    --muted: #5d6570;
    --bg: #f3fbfe;
    --card: #ffffff;
    --line: #d5e9f1;
    --ok: #15803d;
    --ok-bg: #e7f6ec;
    --no: #c2255c;
    --no-bg: #fde8ef;
    --display: "Bebas Neue", "Oswald", "League Gothic", Impact, Haettenschweiler, "Arial Narrow Bold", "Arial Narrow", sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
    background: var(--bg);
    line-height: 1.5;
    font-size: 17px;
  }
  header {
    background: var(--cyan);
    color: #fff;
    padding: 2.2rem 1.25rem 1.8rem;
  }
  .wrap { max-width: 860px; margin: 0 auto; }
  .hero { display: flex; gap: 1.5rem; align-items: center; justify-content: space-between; }
  .hero img { width: 170px; height: auto; border-radius: 12px; border: 4px solid #fff; flex: 0 0 auto; }
  @media (max-width: 600px) { .hero img { width: 96px; } }
  .exhead {
    display: flex; gap: 1.2rem; align-items: center; justify-content: space-between;
    background: #fff; border: 1px solid var(--line); border-radius: 12px;
    padding: 1rem 1.2rem; margin-bottom: 1.25rem;
  }
  .exhead .intro { margin: 0; }
  .exhead img { width: 150px; height: auto; flex: 0 0 auto; border-radius: 8px; }
  @media (max-width: 600px) { .exhead img { width: 84px; } }
  .finale {
    display: flex; gap: 1.2rem; align-items: center;
    background: var(--yellow); border-radius: 12px;
    padding: 1rem 1.2rem; margin-bottom: 1.5rem;
  }
  .finale img { width: 220px; max-width: 40%; height: auto; border-radius: 8px; }
  .finale[hidden] { display: none; }
  .finale { scroll-margin-top: 4.5rem; }
  .finale h2 { color: var(--ink); font-size: clamp(1.6rem, 6vw, 3rem); }
  .finale p { margin: 0; font-weight: 600; }
  .kicker {
    font-weight: 800;
    letter-spacing: .04em;
    text-transform: uppercase;
    font-size: .85rem;
  }
  h1 {
    font-family: var(--display);
    font-weight: 700;
    text-transform: uppercase;
    font-size: clamp(2.6rem, 9vw, 5rem);
    line-height: .95;
    margin: .3rem 0 .4rem;
    letter-spacing: .01em;
  }
  header p { margin: 0; color: #063646; font-weight: 600; }
  nav {
    background: #fff;
    border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 5;
  }
  nav .wrap {
    display: flex; gap: .4rem; overflow-x: auto;
    padding: .6rem 1.25rem;
  }
  .tab {
    flex: 0 0 auto;
    border: 2px solid var(--line);
    background: #fff;
    color: var(--ink);
    font: inherit; font-weight: 700; font-size: .9rem;
    padding: .4rem .75rem;
    border-radius: 999px;
    cursor: pointer;
    white-space: nowrap;
  }
  .tab[aria-selected="true"] { background: var(--cyan); border-color: var(--cyan); color: #fff; }
  .tab.done::after { content: " ✓"; }
  main { padding: 1.5rem 1.25rem 3rem; }
  h2 {
    font-family: var(--display);
    text-transform: uppercase;
    color: var(--cyan);
    font-size: clamp(2rem, 6vw, 3rem);
    line-height: 1;
    margin: .5rem 0 .5rem;
    letter-spacing: .01em;
  }
  .intro { color: var(--muted); margin: 0 0 1.25rem; max-width: 65ch; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 1rem 1.1rem;
    margin: 0 0 1rem;
  }
  .label {
    display: inline-block;
    font-weight: 800; font-size: .75rem; letter-spacing: .06em;
    text-transform: uppercase;
    padding: .1rem .5rem; border-radius: 4px;
    margin-right: .4rem;
  }
  .label.wrong { background: var(--no-bg); color: var(--no); }
  .label.right { background: var(--ok-bg); color: var(--ok); }
  .label.info { background: #e3f6fd; color: var(--cyan-dark); }
  .context { color: var(--muted); font-size: .93rem; margin: .5rem 0; }
  textarea {
    width: 100%; min-height: 4.5rem;
    font: inherit; padding: .6rem .7rem;
    border: 2px solid var(--line); border-radius: 8px;
    resize: vertical; color: var(--ink); background: #fff;
  }
  textarea:focus, button:focus-visible, .clickable:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }
  .btn {
    font: inherit; font-weight: 700;
    border: 0; border-radius: 8px;
    padding: .55rem .95rem;
    background: var(--cyan); color: #fff;
    cursor: pointer;
  }
  .btn:hover { background: var(--cyan-dark); }
  .btn.ghost { background: #fff; color: var(--cyan-dark); border: 2px solid var(--cyan); }
  .btn.ghost:hover { background: #e3f6fd; }
  .btn:disabled { opacity: .45; cursor: default; }
  .row { display: flex; gap: .5rem; flex-wrap: wrap; margin-top: .7rem; align-items: center; }
  .reveal {
    margin-top: .8rem; padding: .75rem .9rem;
    background: var(--ok-bg); border-radius: 8px;
  }
  .reveal p { margin: .3rem 0 0; }
  .why { color: var(--muted); font-size: .93rem; }
  .msg { font-weight: 700; margin: .6rem 0 0; min-height: 1.5em; }
  .msg.ok { color: var(--ok); }
  .msg.no { color: var(--no); }

  /* ordering */
  ol.order { list-style: none; padding: 0; margin: 0 0 1rem; }
  ol.order li {
    display: flex; gap: .7rem; align-items: flex-start;
    background: #fff; border: 2px solid var(--line); border-radius: 10px;
    padding: .7rem .8rem; margin-bottom: .5rem;
  }
  ol.order li.ok { border-color: var(--ok); background: var(--ok-bg); }
  ol.order li.no { border-color: var(--no); background: var(--no-bg); }
  .pos {
    font-family: var(--display); font-size: 1.6rem; line-height: 1;
    color: var(--cyan); min-width: 1.2rem; padding-top: .15rem;
  }
  .otext { flex: 1; }
  .moves { display: flex; flex-direction: column; gap: .25rem; }
  .moves button {
    width: 2.1rem; height: 1.9rem; border-radius: 6px;
    border: 2px solid var(--cyan); background: #fff; color: var(--cyan-dark);
    font-weight: 800; cursor: pointer; font-size: .95rem;
  }
  .moves button:disabled { opacity: .3; cursor: default; }

  /* classify */
  .choice { display: flex; gap: .5rem; flex-wrap: wrap; margin-top: .7rem; }
  .card.ok { border-color: var(--ok); }
  .card.no { border-color: var(--no); }

  /* clickable text */
  .para { font-size: 1.1rem; line-height: 1.9; }
  .clickable { cursor: pointer; border-radius: 4px; padding: .08em .12em; }
  .para .clickable { padding-left: 0; padding-right: 0; }
  .clickable:hover { background: #e3f6fd; }
  .clickable.hit { background: var(--yellow); font-weight: 700; }
  .clickable.miss { background: var(--no-bg); }
  .clickable.keep { background: var(--ok-bg); }
  ul.found { margin: .8rem 0 0; padding-left: 1.1rem; }
  ul.found li { margin-bottom: .35rem; }

  .score {
    font-family: var(--display); text-transform: uppercase;
    font-size: 1.5rem; color: var(--cyan-dark); margin: 1rem 0 0;
  }
  .next { margin-top: 1.5rem; }
  footer a { color: var(--cyan-dark); font-weight: 700; }
  footer {
    border-top: 1px solid var(--line);
    padding: 1rem 1.25rem 2rem; color: var(--muted); font-size: .85rem;
  }
</style>
</head>

  var BAIT = [
    { t: "It is well known", why: "If it is well known, cite it or delete it." },
    { t: " that memory is a " },
    { t: "very important", why: "Says nothing. Why does it matter for your question?" },
    { t: " topic in psychology. " },
    { t: "A lot of studies", why: "Which studies? Cite them." },
    { t: " have shown " },
    { t: "interesting", why: "Your opinion. Say what the studies showed." },
    { t: " results. " },
    { t: "Obviously", why: "If it were obvious, you would not need to write it." },
    { t: ", virtual reality " },
    { t: "plays a crucial role", why: "Which role? Say what VR does." },
    { t: " in this field. In our study, the two groups showed " },
    { t: "different", why: "Which group was better, and at what?" },
    { t: " memory performance, which " },
    { t: "clearly proves", why: "Data support or suggest. They do not prove, and certainly not “clearly”." },
    { t: " our hypothesis." }
  ];

  var ODD = [
    {
      topic: "Topic: VR combines realism with experimental control.",
      sentences: [
        "Virtual reality allows researchers to study behaviour under realistic yet controlled conditions.",
        "Participants can move through a three-dimensional scene and respond to events as they would in everyday life.",
        "At the same time, every stimulus can be timed and repeated exactly.",
        "The first head-mounted display was built in the 1960s and was so heavy that it had to be suspended from the ceiling.",
        "VR therefore combines the ecological validity of field studies with the experimental control of the laboratory."
      ],
      odd: 3,
      why: "True, and a nice story for a dinner party. It does nothing for the argument of this paragraph."
    },
    {
      topic: "Topic: why sleep after learning helps memory.",
      sentences: [
        "Sleep after learning leads to better retention than an equal period of wakefulness.",
        "During sleep, the brain reactivates recently formed memory traces.",
        "This reactivation strengthens the traces and integrates them into existing knowledge.",
        "Velociraptors lived about 75 million years ago in what is now Mongolia.",
        "Wakefulness offers less opportunity for this process, because new input continuously interferes with the fresh traces."
      ],
      odd: 3,
      why: "The reader does not need palaeontology to understand consolidation. One paragraph, one theme."
    }
  ];

  var FUNNEL = [
    { text: "Memory research aims to explain how people remember the events of their own lives.", label: "Wide: the phenomenon" },
    { text: "Yet most laboratory studies use word lists or pictures on a screen, which lack the richness of real experiences.", label: "Narrower: the problem" },
    { text: "Virtual reality could close this gap, but it is unclear whether VR experiences are remembered like real events or like conventional laboratory stimuli.", label: "Narrower: the gap" },
    { text: "We therefore compared recognition memory for a motorcycle ride presented either in 360° VR or as a 2D video.", label: "Narrow: this study" }
  ];

  // ---------- exercise renderers ----------
  function renderFix(root, done) {
    var revealed = 0;
    FIX.forEach(function (item, i) {
      var ta = el("textarea", { "aria-label": "Your version of sentence " + (i + 1), placeholder: "Your version…" });
      var msg = el("p", { class: "msg" });
      var out = el("div");
      var btn = el("button", { class: "btn", type: "button", text: "Show Veloci's version" });
      btn.addEventListener("click", function () {
        if (ta.value.trim().length < 10) {
          msg.className = "msg no";
          msg.textContent = "Write your own version first. Veloci is watching.";
          return;
        }
        msg.textContent = "";
        btn.disabled = true;
        out.appendChild(el("div", { class: "reveal" },
          el("span", { class: "label right", text: "Right" }),
          el("span", { text: item.right }),
          el("p", { class: "why", text: item.why }),
          el("p", { class: "why", text: "Yours does not have to match. Check: does it name who, what and in which direction?" })
        ));
        revealed++;
        if (revealed === FIX.length) done();
      });
      root.appendChild(el("div", { class: "card" },
        el("div", null, el("span", { class: "label wrong", text: "Wrong" }), el("strong", { text: item.wrong })),
        el("p", { class: "context" }, el("span", { class: "label info", text: "What you know" }), item.context),
        ta,
        el("div", { class: "row" }, btn),
        msg,
        out
      ));
    });
  }

  function renderOrder(root, items, done, successText) {
    var order = shuffledOrder(items.length);
    var solved = false;
    var list = el("ol", { class: "order" });
    var msg = el("p", { class: "msg" });
    var check = el("button", { class: "btn", type: "button", text: "Check order" });

    function draw(marks) {
      list.textContent = "";
      order.forEach(function (idx, pos) {
        var up = el("button", { type: "button", "aria-label": "Move up", text: "↑" });
        var down = el("button", { type: "button", "aria-label": "Move down", text: "↓" });
        up.disabled = solved || pos === 0;
        down.disabled = solved || pos === order.length - 1;
        up.addEventListener("click", function () { swap(pos, pos - 1); });
        down.addEventListener("click", function () { swap(pos, pos + 1); });
        var text = el("div", { class: "otext" }, items[idx].text);
        if (solved) {
          text.insertBefore(el("div", null, el("span", { class: "label right", text: items[idx].label })), text.firstChild);
        }
        var li = el("li", null,
          el("span", { class: "pos", text: String(pos + 1) }),
          text,
          el("div", { class: "moves" }, up, down)
        );
        if (marks) li.className = marks[pos] ? "ok" : "no";
        list.appendChild(li);
      });
    }
    function swap(a, b) {
      var t = order[a]; order[a] = order[b]; order[b] = t;
      msg.textContent = "";
      draw(null);
      var btns = list.children[b].querySelectorAll("button:not(:disabled)");
      if (btns.length) btns[0].focus();
    }
    check.addEventListener("click", function () {
      var marks = order.map(function (idx, pos) { return idx === pos; });
      var right = marks.filter(Boolean).length;
      if (right === items.length) {
        solved = true;
        check.disabled = true;
        msg.className = "msg ok";
        msg.textContent = successText;
        done();
      } else {
        msg.className = "msg no";
        msg.textContent = right + " of " + items.length + " in the right place. Green stays, red moves.";
      }
      draw(marks);
    });
    draw(null);
    root.appendChild(list);
    root.appendChild(el("div", { class: "row" }, check));
    root.appendChild(msg);
  }

  function renderClassify(root, done) {
    var answered = 0, correct = 0;
    var score = el("p", { class: "score" });
    CLASSIFY.forEach(function (item) {
      var fb = el("p", { class: "msg" });
      var why = el("p", { class: "why" });
      var card = el("div", { class: "card" });
      function pick(choice, bR, bI) {
        bR.disabled = true; bI.disabled = true;
        var ok = choice === item.answer;
        answered++; if (ok) correct++;
        card.classList.add(ok ? "ok" : "no");
        fb.className = "msg " + (ok ? "ok" : "no");
        fb.textContent = (ok ? "Correct. " : "No. ") + (item.answer === "R" ? "This is a result." : "This is an interpretation.");
        why.textContent = item.why;
        if (answered === CLASSIFY.length) {
          score.textContent = correct + " of " + CLASSIFY.length + " correct.";
          done();
        }
      }
      var bR = el("button", { class: "btn ghost", type: "button", text: "Result" });
      var bI = el("button", { class: "btn ghost", type: "button", text: "Interpretation" });
      bR.addEventListener("click", function () { pick("R", bR, bI); });
      bI.addEventListener("click", function () { pick("I", bR, bI); });
      card.appendChild(el("div", { text: item.text }));
      card.appendChild(el("div", { class: "choice" }, bR, bI));
      card.appendChild(fb);
      card.appendChild(why);
      root.appendChild(card);
    });
    root.appendChild(score);
  }

  function renderBait(root, done) {
    var total = BAIT.filter(function (s) { return s.why; }).length;
    var found = 0;
    var para = el("p", { class: "para" });
    var counter = el("p", { class: "msg" });
    var notes = el("ul", { class: "found" });
    var finished = false;

    function update(text, cls) {
      counter.className = "msg " + (cls || "");
      counter.textContent = text;
    }
    function hit(span, seg) {
      if (span.classList.contains("hit")) return;
      span.classList.add("hit");
      found++;
      notes.appendChild(el("li", null, el("strong", { text: "“" + seg.t.trim() + "” " }), seg.why));
      if (found === total) {
        finished = true;
        update("All " + total + " found. Veloci is satisfied.", "ok");
        done();
      } else {
        update(found + " of " + total + " found.", "ok");
      }
    }
    BAIT.forEach(function (seg) {
      if (seg.why) {
        var s = el("span", { text: seg.t });
        makeClickable(s, function () { hit(s, seg); });
        seg.node = s;
        para.appendChild(s);
      } else {
        seg.t.split(/(\s+)/).forEach(function (part) {
          if (!part) return;
          if (/^\s+$/.test(part) || !/[A-Za-z]/.test(part)) { para.appendChild(document.createTextNode(part)); return; }
          var w = el("span", { text: part });
          makeClickable(w, function () {
            if (finished) return;
            w.classList.add("miss");
            update("“" + part.replace(/[.,]/g, "") + "” is fine. Keep looking. " + found + " of " + total + " found.", "no");
            setTimeout(function () { w.classList.remove("miss"); }, 700);
          });
          para.appendChild(w);
        });
      }
    });
    var giveUp = el("button", { class: "btn ghost", type: "button", text: "Show the rest" });
    giveUp.addEventListener("click", function () {
      BAIT.forEach(function (seg) { if (seg.why) hit(seg.node, seg); });
      giveUp.disabled = true;
    });
    update("0 of " + total + " found.");
    root.appendChild(el("div", { class: "card" }, para, counter, notes));
    root.appendChild(el("div", { class: "row" }, giveUp));
  }

  function renderOdd(root, done) {
    var solved = 0;
    ODD.forEach(function (p) {
      var para = el("p", { class: "para" });
      var msg = el("p", { class: "msg" });
      var why = el("p", { class: "why" });
      var locked = false;
      p.sentences.forEach(function (s, i) {
        var span = el("span", { text: s });
        makeClickable(span, function () {
          if (locked) return;
          if (i === p.odd) {
            locked = true;
            span.classList.add("hit");
            msg.className = "msg ok";
            msg.textContent = "That is the one. Delete it.";
            why.textContent = p.why;
            solved++;
            if (solved === ODD.length) done();
          } else {
            span.classList.add("keep");
            msg.className = "msg no";
            msg.textContent = "This one stays. It serves the topic of the paragraph.";
          }
        });
        para.appendChild(span);
        para.appendChild(document.createTextNode(" "));
      });
      root.appendChild(el("div", { class: "card" },
        el("p", { class: "context" }, el("span", { class: "label info", text: "Paragraph" }), p.topic),
        para, msg, why
      ));
    });
  }

  // ---------- app ----------
  var EXERCISES = [
    {
      tab: "1 · Fix the sentence",
      title: "Fix the sentence",
      img: "pen", alt: "Veloci marking a manuscript with a red pen",
      intro: "Each sentence below would get eaten. Rewrite it using the information given, then compare with Veloci's version.",
      render: renderFix
    },
    {
      tab: "2 · Sort the abstract",
      title: "Sort the abstract",
      img: "sheet", alt: "Veloci holding up a single sheet of paper",
      intro: "An abstract follows the structure of the paper: introduction, methods, results, discussion. These six sentences are in the wrong order. Fix that.",
      render: function (root, done) {
        renderOrder(root, ABSTRACT, done, "Correct. Relevance, gap, question, methods, results, discussion. Every abstract, every time.");
      }
    },
    {
      tab: "3 · Result or interpretation?",
      title: "Result or interpretation?",
      img: "chart", alt: "Veloci pointing at a bar chart with a finger on the lips",
      intro: "Results describe what was measured. Interpretation says what it means, and belongs in the discussion. Decide for each sentence.",
      render: renderClassify
    },
    {
      tab: "4 · Raptor bait",
      title: "Raptor bait",
      img: "bat", alt: "Veloci leaning on a baseball bat",
      intro: "This paragraph contains eight words or phrases that say nothing. Click them.",
      render: renderBait
    },
    {
      tab: "5 · Odd one out",
      title: "Which sentence does not belong?",
      img: "puzzle", alt: "Veloci holding a puzzle piece that does not fit",
      intro: "A paragraph sticks to one theme. In each paragraph below, one sentence leaves it. Click that sentence.",
      render: renderOdd
    },
    {
      tab: "6 · Build the funnel",
      title: "Build the funnel",
      img: "funnel", alt: "Veloci feeding a pile of papers into a funnel",
      intro: "An introduction starts wide and becomes narrow until it arrives at the study. Each sentence below stands for one paragraph. Put them in order.",
      render: function (root, done) {
        renderOrder(root, FUNNEL, done, "Correct. Phenomenon, problem, gap, study. The reader could have guessed the last sentence. That is the point.");
      }
    }
  ];

  var tabsEl = document.getElementById("tabs");
  var mainEl = document.getElementById("main");
  var tabButtons = [];
  var panels = [];
  var current = 0;
  var doneCount = 0;

  if (IMG.desk) document.getElementById("hero").src = IMG.desk;
  else document.getElementById("hero").remove();

  var finale = el("div", { class: "finale" });
  if (IMG.mailbox) finale.appendChild(el("img", { src: IMG.mailbox, alt: "Veloci posting a manuscript, wearing a graduation cap" }));
  finale.appendChild(el("div", null,
    el("h2", { text: "Submitted." }),
    el("p", { text: "All six exercises done. Veloci approves. Now do the same to your own manuscript." })
  ));
  finale.hidden = true;
  mainEl.appendChild(finale);

  function show(i) {
    current = i;
    tabButtons.forEach(function (b, k) { b.setAttribute("aria-selected", k === i ? "true" : "false"); });
    panels.forEach(function (p, k) { p.hidden = k !== i; });
    tabButtons[i].scrollIntoView({ block: "nearest", inline: "center" });
    window.scrollTo(0, 0);
  }

  EXERCISES.forEach(function (ex, i) {
    var tab = el("button", { class: "tab", type: "button", role: "tab", text: ex.tab });
    tab.addEventListener("click", function () { show(i); });
    tabsEl.appendChild(tab);
    tabButtons.push(tab);

    var head = el("div", { class: "exhead" }, el("p", { class: "intro", text: ex.intro }));
    if (IMG[ex.img]) head.appendChild(el("img", { src: IMG[ex.img], alt: ex.alt }));
    var panel = el("section", { role: "tabpanel" },
      el("h2", { text: ex.title }),
      head
    );
    var body = el("div");
    panel.appendChild(body);
    ex.render(body, function () {
      if (tab.classList.contains("done")) return;
      tab.classList.add("done");
      doneCount++;
      if (doneCount === EXERCISES.length) {
        finale.hidden = false;
        finale.scrollIntoView({ behavior: "smooth", block: "start" });
      }
    });

    if (i < EXERCISES.length - 1) {
      var next = el("button", { class: "btn ghost", type: "button", text: "Next exercise →" });
      next.addEventListener("click", function () { show(i + 1); });
      panel.appendChild(el("div", { class: "next" }, next));
    }
    panel.hidden = true;
    mainEl.appendChild(panel);
    panels.push(panel);
  });

  show(0);
})();
</script>
</body>
</html>
